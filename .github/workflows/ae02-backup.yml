name: AE-02 backup validation
on:
  push:
    branches: [contest/ae02-minimax-backup]
  pull_request:
    paths: ['minimax/**', '.github/workflows/ae02-backup.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r minimax/requirements.txt
      - run: PYTHONPATH=minimax/src python -m pytest -q minimax/tests
  services:
    # Only code pushed to this trusted branch receives runtime model credentials.
    if: github.ref == 'refs/heads/contest/ae02-minimax-backup' && github.event_name != 'pull_request'
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned PowerContext and pipeline dependencies
        run: |
          python -m pip install -r minimax/requirements.txt
          python -m pip install 'powercontext[cli,server] @ git+https://github.com/oceanbase/powercontext.git@cdb8da296a8ed1ad06ac851af7fd05139907a966'
      - name: Real seekdb and PowerContext acceptance
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          EVIDENCE_ROOT: ${{ runner.temp }}/ae02-evidence
          POWERCONTEXT_HOME: ${{ runner.temp }}/ae02-powercontext
          POWERCONTEXT_URL: http://127.0.0.1:8000
          SEEKDB_PORT: '13881'
        run: bash minimax/scripts/cloud_validate.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ae02-${{ github.sha }}
          path: ${{ runner.temp }}/ae02-evidence
          if-no-files-found: error
          retention-days: 14
