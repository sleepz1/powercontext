name: AE-02 backup validation
on:
  push:
    branches: [contest/ae02-minimax-backup]
  pull_request:
    paths: ['minimax/**', '.github/workflows/ae02-backup.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r minimax/requirements.txt
      - run: PYTHONPATH=minimax/src python -m pytest -q minimax/tests
