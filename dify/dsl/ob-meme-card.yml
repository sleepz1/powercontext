      data:
        type: code
        title: 改写检索词
        desc: 把抽卡口令收成知识库查询，并认出稀有度
        code_language: python3
        code: |
          def rewrite_main(query, last_theme):
              def is_redraw(text):
                  keys = ("再来一张卡", "再来一张", "换一张", "再抽一张", "下一张", "再抽", "再来")
                  return any(key in text for key in keys)

              def detect_rarity(text):
                  upper = text.upper()
                  if "SSR" in upper:
                      return "SSR"
                  if "SR" in upper:
                      return "SR"
                  padded = " " + upper + " "
                  if " R " in padded or (upper.endswith("R") and not upper.endswith("SR")):
                      return "R"
                  return ""

              def is_generic(text, rarity):
                  keys = (
                      "再来一张卡",
                      "再来一张",
                      "换一张",
                      "再抽一张",
                      "下一张",
                      "再抽",
                      "再来",
                      "随机来一张",
                      "抽一张",
                      "抽卡",
                      "来一张",
                      "随机",
                      "抽",
                  )
                  cleaned = text
                  for key in keys:
                      cleaned = cleaned.replace(key, " ")
                  if rarity:
                      cleaned = cleaned.replace(rarity, " ")
                      cleaned = cleaned.replace(rarity.lower(), " ")
                  leftover = []
                  for ch in cleaned:
                      if ch.isspace() or ch in "，。！？、~～!?,.":
                          continue
                      leftover.append(ch)
                  return "".join(leftover) == ""

              text = (query or "").strip()
              rarity = detect_rarity(text)
              redraw = "yes" if is_redraw(text) else "no"
              generic = is_generic(text, rarity)
              theme = (last_theme or "").strip()
              if redraw == "yes" and generic and theme:
                  search = theme
              elif generic or text == "":
                  search = "OceanBase seekdb Dify 冷知识"
              else:
                  search = text
              return {"search_query": search, "redraw": redraw, "rarity": rarity}


          def main(query, last_theme):
              return rewrite_main(query, last_theme)
        variables:
        - variable: query
          value_selector:
          - sys
          - query
        - variable: last_theme
          value_selector:
          - conversation
          - last_theme
        outputs:
          search_query:
            type: string
            children: null
          redraw:
            type: string
            children: null
          rarity:
            type: string
            children: null
